<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Gooseroot</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/gooseroot-ui.css"><style>body{margin:0;background:var(--bg)}.gr-backlink{top:auto!important;bottom:20px}@media(max-width:760px){.gr-backlink{bottom:92px!important;right:16px!important}}</style><script src="../js/gooseroot-ui.js"></script></head><body>
<a href="../index.html" style="position:fixed;right:20px;top:20px;z-index:60;font:500 13px Poppins,sans-serif;padding:9px 14px;border-radius:999px;background:var(--ink);color:var(--on-ink);text-decoration:none;box-shadow:var(--shadow-lg)" class="gr-backlink">← All pages</a>
<div class="gr"><div class="gr-signin">
<div class="gr-signin__brand">
  <span class="gr-signin__mark" data-logo="symbol-white"></span>
  <span class="gr-logo" style="width:200px;position:relative" data-logo="wordmark-white"></span>
  <div style="margin-top:auto;position:relative;max-width:520px"><div class="gr-overline" style="color:rgba(255,255,255,.8)">Client portal</div>
  <h1 class="gr-signin__title">Where ideas and technology come together.</h1>
  <p style="font-size:16px;line-height:26px;color:rgba(255,255,255,.88)">Follow your project's progress, review designs and talk to the team, all in one place.</p></div>
  <div style="margin-top:48px;position:relative;font-size:13px;color:rgba(255,255,255,.8)">© 2026 Gooseroot · gooseroot.com</div>
</div>
<div class="gr-signin__form">
  <div class="gr-card gr-signin__card">
    <h2 class="gr-h2">Welcome back</h2><p class="gr-muted" style="margin:6px 0 28px">Sign in to your Gooseroot workspace.</p>
    <div class="gr-stack" style="gap:18px">
      <div class="gr-field"><label>Work email</label><div class="gr-inputwrap"><i data-icon="mail" class=""></i><input class="gr-input" placeholder="you@company.com"></div></div>
      <div class="gr-field"><label>Password</label><div class="gr-inputwrap"><i data-icon="lock" class=""></i><input class="gr-input" type="password" value="password12"></div></div>
      <div class="gr-row" style="justify-content:space-between"><label class="gr-check"><input type="checkbox" checked> Remember me</label><a href="#" style="color:var(--primary);font-size:13px;font-weight:500;text-decoration:none">Forgot password?</a></div>
      <button class="gr-btn gr-btn--primary gr-btn--lg gr-btn--block">Sign in <i data-icon="arrow-right" class=""></i></button>
      <div class="gr-row" style="gap:12px;color:var(--muted);font-size:12px"><span style="flex:1;height:1px;background:var(--line)"></span>or<span style="flex:1;height:1px;background:var(--line)"></span></div>
      <button class="gr-btn gr-btn--secondary gr-btn--lg gr-btn--block"><i data-icon="link" class=""></i> Continue with a magic link</button>
    </div>
    <p class="gr-caption" style="text-align:center;margin-top:26px">New to Gooseroot? <a href="#" style="color:var(--primary);font-weight:500;text-decoration:none">Start a project</a></p>
  </div>
</div></div>
</div>
<script>Gooseroot.mount();</script>
</body></html>
