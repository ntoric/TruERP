[[permission]]
identifier = "allow-frontend-ready"
description = "Allow checking whether the local Next.js UI is ready"
commands.allow = ["frontend_ready"]

[[permission]]
identifier = "allow-app-url"
description = "Allow reading the local reverse-proxy URL"
commands.allow = ["app_url"]

[[permission]]
identifier = "allow-data-directory"
description = "Allow reading the TruERP data directory path"
commands.allow = ["data_directory"]

[[permission]]
identifier = "allow-has-native-printing"
description = "Allow checking native printing support"
commands.allow = ["has_native_printing"]

[[permission]]
identifier = "allow-list-printers"
description = "Allow listing OS printers"
commands.allow = ["list_printers"]

[[permission]]
identifier = "allow-print-pdf"
description = "Allow printing a PDF document"
commands.allow = ["print_pdf"]
